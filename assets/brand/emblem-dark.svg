<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- caisson emblem, dark mode: night on the bay — the Bay Lights on the
       suspenders, the structure a silhouette, the foundation still glowing -->
  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="512" height="512" rx="48"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <!-- night sky -->
    <rect x="0" y="0" width="512" height="512" fill="#151B24"/>
    <!-- night water -->
    <rect x="0" y="176" width="512" height="336" fill="#0E141D"/>
    <!-- bedrock -->
    <rect x="0" y="428" width="512" height="84" fill="#090E15"/>

    <!-- structure as silhouette (deck, cables, anchorage) -->
    <g stroke="#39414C" stroke-linecap="round" fill="none" opacity="0.9">
      <line x1="-16" y1="140" x2="528" y2="140" stroke-width="12"/>
      <path d="M -16 44 Q 112 118 224 116" stroke-width="7"/>
      <path d="M 528 44 Q 400 118 288 116" stroke-width="7"/>
      <rect x="222" y="108" width="68" height="68" fill="#39414C" stroke="none"/>
    </g>

    <!-- the Bay Lights: suspenders as strings of lights, a few LEDs out -->
    <g fill="#E8ECF2">
      <circle cx="47" cy="76" r="1.5"/><circle cx="47" cy="84" r="1.5"/><circle cx="47" cy="92" r="1.5"/><circle cx="47" cy="100" r="1.5"/><circle cx="47" cy="124" r="1.5"/>
      <circle cx="102" cy="97" r="1.5"/><circle cx="102" cy="105" r="1.5"/><circle cx="102" cy="113" r="1.5"/><circle cx="102" cy="129" r="1.5"/>
      <circle cx="150" cy="125" r="1.5"/>
      <circle cx="191" cy="115" r="1.5"/><circle cx="191" cy="123" r="1.5"/>
      <circle cx="321" cy="115" r="1.5"/><circle cx="321" cy="123" r="1.5"/>
      <circle cx="362" cy="109" r="1.5"/><circle cx="362" cy="125" r="1.5"/>
      <circle cx="410" cy="97" r="1.5"/><circle cx="410" cy="105" r="1.5"/>
      <circle cx="465" cy="76" r="1.5"/><circle cx="465" cy="92" r="1.5"/><circle cx="465" cy="100" r="1.5"/><circle cx="465" cy="108" r="1.5"/><circle cx="465" cy="116" r="1.5"/><circle cx="465" cy="124" r="1.5"/>
    </g>
    <!-- adjacent LEDs blooming into short lit segments -->
    <g stroke="#E8ECF2" stroke-width="3" stroke-linecap="round">
      <line x1="47" y1="108" x2="47" y2="116"/>
      <line x1="150" y1="109" x2="150" y2="117"/>
      <line x1="410" y1="113" x2="410" y2="129"/>
    </g>

    <!-- waterline -->
    <line x1="0" y1="176" x2="512" y2="176" stroke="#05080C" stroke-width="6"/>

    <!-- caisson block, still glowing -->
    <rect x="176" y="176" width="160" height="252" fill="#1C2836" stroke="#7EBAE4" stroke-width="4"/>
    <g stroke="#5277C3" stroke-width="3">
      <line x1="256" y1="176" x2="256" y2="428"/>
      <line x1="176" y1="260" x2="336" y2="260"/>
      <line x1="176" y1="344" x2="336" y2="344"/>
    </g>
    <rect x="258" y="346" width="76" height="80" fill="#7F5AB6" fill-opacity="0.25"/>
    <g stroke="#5277C3" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M 200 190 L 232 246 M 216 218 L 200 246"/>
      <path d="M 280 190 L 312 246 M 296 218 L 280 246"/>
      <path d="M 200 274 L 232 330 M 216 302 L 200 330"/>
      <path d="M 280 274 L 312 330 M 296 302 L 280 330"/>
      <path d="M 200 358 L 232 414 M 216 386 L 200 414"/>
      <path d="M 280 358 L 312 414 M 296 386 L 280 414"/>
    </g>

    <!-- the rivet, lit -->
    <circle cx="256" cy="176" r="11" fill="#C9A227"/>
  </g>
</svg>
