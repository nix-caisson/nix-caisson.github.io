<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- caisson emblem — "Caisson Waterline" concept: truss above, foundation below -->
  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="512" height="512" rx="48"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <!-- sky / fog field -->
    <rect x="0" y="0" width="512" height="512" fill="#D8DBDE"/>
    <!-- water -->
    <rect x="0" y="176" width="512" height="336" fill="#27394E"/>
    <!-- bedrock -->
    <rect x="0" y="428" width="512" height="84" fill="#1B2635"/>

    <!-- west crossing at the central anchorage: two suspension spans
         meet at a stout block standing on the caisson -->
    <g stroke="#43464B" stroke-linecap="round" fill="none" opacity="0.8">
      <!-- deck -->
      <line x1="-16" y1="140" x2="528" y2="140" stroke-width="12"/>
      <!-- main cables sagging in from off-frame towers, entering the
           anchorage nearly flat -->
      <path d="M -16 44 Q 112 118 224 116" stroke-width="7"/>
      <path d="M 528 44 Q 400 118 288 116" stroke-width="7"/>
      <!-- suspenders -->
      <line x1="47" y1="76" x2="47" y2="140" stroke-width="3"/>
      <line x1="102" y1="97" x2="102" y2="140" stroke-width="3"/>
      <line x1="150" y1="109" x2="150" y2="140" stroke-width="3"/>
      <line x1="191" y1="115" x2="191" y2="140" stroke-width="3"/>
      <line x1="465" y1="76" x2="465" y2="140" stroke-width="3"/>
      <line x1="410" y1="97" x2="410" y2="140" stroke-width="3"/>
      <line x1="362" y1="109" x2="362" y2="140" stroke-width="3"/>
      <line x1="321" y1="115" x2="321" y2="140" stroke-width="3"/>
      <!-- the anchorage block, over deck and down to the waterline;
           inside the group so the deck doesn't ghost through it -->
      <rect x="222" y="108" width="68" height="68" fill="#43464B" stroke="none"/>
    </g>

    <!-- waterline -->
    <line x1="0" y1="176" x2="512" y2="176" stroke="#1B2635" stroke-width="6"/>

    <!-- caisson block descending to bedrock -->
    <rect x="176" y="176" width="160" height="252" fill="#2E4158" stroke="#7EBAE4" stroke-width="4"/>
    <!-- lattice walls: 2 cols x 3 rows -->
    <g stroke="#5277C3" stroke-width="3">
      <line x1="256" y1="176" x2="256" y2="428"/>
      <line x1="176" y1="260" x2="336" y2="260"/>
      <line x1="176" y1="344" x2="336" y2="344"/>
    </g>
    <!-- easter egg: one violet cell -->
    <rect x="258" y="346" width="76" height="80" fill="#7F5AB6" fill-opacity="0.18"/>
    <!-- lambda bracing in each cell (cells 80x84; steep strokes) -->
    <g stroke="#5277C3" stroke-width="8" stroke-linecap="round" fill="none">
      <!-- row 1 -->
      <path d="M 200 190 L 232 246 M 216 218 L 200 246"/>
      <path d="M 280 190 L 312 246 M 296 218 L 280 246"/>
      <!-- row 2 -->
      <path d="M 200 274 L 232 330 M 216 302 L 200 330"/>
      <path d="M 280 274 L 312 330 M 296 302 L 280 330"/>
      <!-- row 3 -->
      <path d="M 200 358 L 232 414 M 216 386 L 200 414"/>
      <path d="M 280 358 L 312 414 M 296 386 L 280 414"/>
    </g>

    <!-- the one gold element: rivet at truss/waterline junction -->
    <circle cx="256" cy="176" r="11" fill="#C9A227"/>
  </g>
</svg>
