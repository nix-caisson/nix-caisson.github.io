<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- caisson favicon — the below-waterline block alone -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#27394E"/>
  <!-- waterline hint -->
  <line x1="6" y1="12" x2="58" y2="12" stroke="#7EBAE4" stroke-width="3" stroke-linecap="round"/>
  <!-- one lattice cell -->
  <rect x="16" y="20" width="32" height="34" fill="#2E4158" stroke="#5277C3" stroke-width="3"/>
  <!-- lambda brace -->
  <path d="M 25 26 L 40 48 M 32.5 37 L 25 48" stroke="#7EBAE4" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
