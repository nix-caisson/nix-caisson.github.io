<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- caisson social preview card 1280x640: the two suspension spans of
       the west crossing cradle the wordmark, meeting at the central
       anchorage on its caisson. Above-water geometry is the emblem's,
       scaled by the deck-to-water gap (40/36); the underwater world is
       vertically compressed by the format. -->
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDE0E3"/>
      <stop offset="1" stop-color="#C9CDD2"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="640" fill="url(#fog)"/>
  <!-- water -->
  <rect x="0" y="416" width="1280" height="224" fill="#27394E"/>
  <!-- bedrock -->
  <rect x="0" y="584" width="1280" height="56" fill="#1B2635"/>

  <!-- deck and cables -->
  <g stroke="#43464B" stroke-linecap="round" fill="none" opacity="0.8">
    <line x1="-24" y1="376" x2="1304" y2="376" stroke-width="12"/>
    <path d="M -24 100 Q 300 344 606 352" stroke-width="8"/>
    <path d="M 1304 100 Q 980 344 674 352" stroke-width="8"/>
    <!-- suspenders at the emblem's spacing -->
    <line x1="80" y1="172" x2="80" y2="376" stroke-width="3.5"/>
    <line x1="140" y1="209" x2="140" y2="376" stroke-width="3.5"/>
    <line x1="200" y1="242" x2="200" y2="376" stroke-width="3.5"/>
    <line x1="260" y1="270" x2="260" y2="376" stroke-width="3.5"/>
    <line x1="320" y1="294" x2="320" y2="376" stroke-width="3.5"/>
    <line x1="380" y1="315" x2="380" y2="376" stroke-width="3.5"/>
    <line x1="440" y1="331" x2="440" y2="376" stroke-width="3.5"/>
    <line x1="500" y1="342" x2="500" y2="376" stroke-width="3.5"/>
    <line x1="560" y1="350" x2="560" y2="376" stroke-width="3.5"/>
    <line x1="1200" y1="172" x2="1200" y2="376" stroke-width="3.5"/>
    <line x1="1140" y1="209" x2="1140" y2="376" stroke-width="3.5"/>
    <line x1="1080" y1="242" x2="1080" y2="376" stroke-width="3.5"/>
    <line x1="1020" y1="270" x2="1020" y2="376" stroke-width="3.5"/>
    <line x1="960" y1="294" x2="960" y2="376" stroke-width="3.5"/>
    <line x1="900" y1="315" x2="900" y2="376" stroke-width="3.5"/>
    <line x1="840" y1="331" x2="840" y2="376" stroke-width="3.5"/>
    <line x1="780" y1="342" x2="780" y2="376" stroke-width="3.5"/>
    <line x1="720" y1="350" x2="720" y2="376" stroke-width="3.5"/>
    <!-- the anchorage block: emblem proportions (square-ish, shoulder
         proud of the cable entry, deck crossing a third of the way
         down); inside the group so the deck doesn't ghost through it -->
    <rect x="602" y="343" width="76" height="73" fill="#43464B" stroke="none"/>
  </g>

  <!-- waterline -->
  <line x1="0" y1="416" x2="1280" y2="416" stroke="#1B2635" stroke-width="6"/>

  <!-- caisson block under the anchorage, emblem width ratio -->
  <rect x="552" y="416" width="176" height="168" fill="#2E4158" stroke="#7EBAE4" stroke-width="4"/>
  <g stroke="#5277C3" stroke-width="3">
    <line x1="640" y1="416" x2="640" y2="584"/>
    <line x1="552" y1="500" x2="728" y2="500"/>
  </g>
  <!-- easter egg: the violet cell, same as the emblem's -->
  <rect x="642" y="502" width="84" height="80" fill="#7F5AB6" fill-opacity="0.18"/>
  <g stroke="#5277C3" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M 578 430 L 612 486 M 595 458 L 578 486"/>
    <path d="M 666 430 L 700 486 M 683 458 L 666 486"/>
    <path d="M 578 514 L 612 570 M 595 542 L 578 570"/>
    <path d="M 666 514 L 700 570 M 683 542 L 666 570"/>
  </g>

  <!-- rivet -->
  <circle cx="640" cy="416" r="10" fill="#C9A227"/>

  <!-- wordmark + tagline cradled between the cables -->
  <text x="640" y="170" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', 'DejaVu Sans', system-ui, sans-serif"
        font-size="132" font-weight="500" letter-spacing="-3" fill="#43464B">caisson</text>
  <text x="640" y="234" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', 'DejaVu Sans', system-ui, sans-serif"
        font-size="38" font-weight="400" fill="#5C6167">The foundation framework</text>
  <text x="640" y="282" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', 'DejaVu Sans', system-ui, sans-serif"
        font-size="38" font-weight="400" fill="#5C6167">for composable Nix flakes</text>
</svg>
